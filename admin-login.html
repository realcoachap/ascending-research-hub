<!doctype html>
<!-- Ascending Shop Admin Login v0.8.53 - Theo ☠️ - 2026-06-01 -->
<!-- WHY: Separate operator login route backed by Supabase Auth and an allow-listed admin role. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050914" />
  <title>Ascending Admin Login</title>
  <style>
    :root {
      --bg: #050914;
      --panel: rgba(255,255,255,.075);
      --line: rgba(255,255,255,.14);
      --ink: #f8fbff;
      --muted: rgba(248,251,255,.7);
      --blue: #3d73ff;
      --cyan: #8fc4ff;
      --green: #78e8ad;
      --red: #ff8d8d;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(61,115,255,.26), transparent 34%),
        radial-gradient(circle at 88% 18%, rgba(143,196,255,.16), transparent 30%),
        linear-gradient(180deg, #050914 0%, #081120 52%, #03060c 100%);
      display: grid;
      place-items: center;
      padding: 18px;
    }
    a { color: var(--cyan); text-decoration: none; }
    button, input { font: inherit; }
    .shell {
      width: min(520px, 100%);
      display: grid;
      gap: 14px;
      align-items: stretch;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.1), var(--panel));
      box-shadow: 0 30px 100px rgba(0,0,0,.44);
      padding: 22px;
    }
    .admin-brand {
      position: relative;
      display: grid;
      place-items: center;
      width: 238px;
      max-width: 100%;
      height: 58px;
      border: 1px solid rgba(143,196,255,.22);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
      margin: 0 0 18px;
    }
    .admin-brand img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
    }
    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      color: var(--cyan);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 99px;
      background: var(--green);
      box-shadow: 0 0 16px rgba(120,232,173,.65);
    }
    h2 {
      margin: 0 0 10px;
      font-size: 34px;
      letter-spacing: -.03em;
    }
    p { color: var(--muted); line-height: 1.55; }
    .form { display: grid; gap: 12px; }
    label {
      display: grid;
      gap: 7px;
      color: rgba(248,251,255,.54);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    input {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(0,0,0,.2);
      color: var(--ink);
      padding: 0 12px;
      outline: 0;
    }
    input:focus {
      border-color: rgba(143,196,255,.72);
      box-shadow: 0 0 0 3px rgba(61,115,255,.16);
    }
    .btn {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,.06);
      color: var(--muted);
      padding: 0 14px;
      font-size: 12px;
      font-weight: 950;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn.primary {
      border-color: transparent;
      background: var(--blue);
      color: #fff;
    }
    .result {
      display: none;
      border: 1px solid rgba(120,232,173,.32);
      border-radius: var(--radius);
      background: rgba(120,232,173,.08);
      padding: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    .result.show { display: block; }
    .result.error {
      border-color: rgba(255,141,141,.34);
      background: rgba(255,141,141,.09);
    }
    .links {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .is-hidden { display: none; }
    @media (max-width: 820px) {
      body { place-items: start center; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="adminTitle">
      <div class="admin-brand" aria-label="Ascending Aminos">
        <img src="assets/brand/ascending-aminos-logo-horizontal-light-v0-8-46.jpg" alt="Ascending Aminos" width="1192" height="324">
      </div>
      <span class="eyebrow">Admin login</span>
      <h2 id="adminTitle">Sign in to admin</h2>
      <p>Use this separate link for operator tasks. Customer account registration remains on the customer access page.</p>
      <form class="form" id="adminForm">
        <label>Admin
          <input id="adminEmail" type="email" autocomplete="username" placeholder="Admin" required>
        </label>
        <label>Password
          <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Password" minlength="6" required>
        </label>
        <button class="btn primary" type="submit">Enter admin console</button>
      </form>
      <form class="form is-hidden" id="resetForm" aria-live="polite"></form>
      <div class="result" id="result" role="status"></div>
      <div class="links">
        <a href="auth.html">Customer login/register</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    // Ascending Shop Admin Login v0.8.53 - Theo ☠️ - 2026-06-01
    // WHY: Keeps admin separate from customer auth and verifies the Supabase admin allow-list before opening the console.
    const gateVersion = "v0.8.53";
    const adminSessionKey = "aa-admin-session-v0.8.12";
    const idleActivityStorageKey = "aa-session-last-activity-v0.8.53";
    const adminForm = document.getElementById("adminForm");
    const resetForm = document.getElementById("resetForm");
    const result = document.getElementById("result");
    const isPublicStatic = location.hostname.includes("github.io");
    const publicStoreHref = "ascending-aminos-store-latest.html";
    const isPublicHubRuntime = isPublicStatic || location.pathname.includes("/ascending-research-hub/");
    const storeHref = isPublicHubRuntime ? publicStoreHref : "index.html";
    const next = safeReturnPath(new URLSearchParams(location.search).get("next"), storeHref);
    const supabaseConfig = window.ASCENDING_SUPABASE || {};
    const supabaseClient = supabaseIsConfigured() ? window.supabase.createClient(supabaseConfig.url, supabaseConfig.anonKey) : null;
    document.querySelectorAll("[data-store-link]").forEach(link => { link.href = storeHref; });
    clearSharedResearchWorker();

    async function clearSharedResearchWorker() {
      // WHY: The public admin portal shares a path with Ascending Research; remove old root SW/cache control before returning to Aminos.
      try {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations
            .filter(registration => registration.scope.includes("/ascending-research-hub/"))
            .map(registration => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys
            .filter(key => key.startsWith("ascending-research-hub-"))
            .map(key => caches.delete(key)));
        }
      } catch (error) {
        console.warn("Shared service worker cleanup failed", error);
      }
    }

    function supabaseIsConfigured() {
      return Boolean(
        window.supabase?.createClient &&
        supabaseConfig.url &&
        supabaseConfig.anonKey &&
        !String(supabaseConfig.url).includes("YOUR_") &&
        !String(supabaseConfig.anonKey).includes("YOUR_")
      );
    }

    function showResult(message, error = false) {
      result.textContent = message;
      result.classList.add("show");
      result.classList.toggle("error", error);
    }

    function touchIdleActivity() {
      localStorage.setItem(idleActivityStorageKey, String(Date.now()));
    }

    function safeReturnPath(value, fallback) {
      // WHY: Admin login can receive a return target, but a verified login must never become an external or script redirect.
      const raw = String(value || "").trim();
      if (!raw || /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(raw)) return fallback;
      try {
        const resolved = new URL(raw, location.href);
        if (resolved.origin !== location.origin) return fallback;
        const page = resolved.pathname.split("/").pop() || fallback;
        if (!isPublicHubRuntime) return `${page}${resolved.search}${resolved.hash}`;
        // WHY: The public customer store no longer embeds an admin console, so stale #admin returns normalize to the safe storefront.
        if (page === "index.html") return `${publicStoreHref}${resolved.search}`;
        if (/^ascending-aminos-store-(?:latest|v\d+(?:-\d+){2,})\.html$/i.test(page)) return `${page}${resolved.search}`;
        return fallback;
      } catch {
        return fallback;
      }
    }

    async function apiLogin(email, password) {
      const response = await fetch("/api/admin/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ email, password })
      });
      const body = await response.json();
      if (!response.ok || !body.ok) throw new Error(body.error || "Admin login failed.");
      return body.admin;
    }

    async function activeAdminFromSession() {
      const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
      const session = sessionData?.session;
      if (sessionError || !session?.user) throw new Error("Reset session could not be verified. Please open the latest password reset email link.");

      const { data: profile, error: profileError } = await supabaseClient
        .from("aa_admin_profiles")
        .select("user_id,email,role,status")
        .eq("user_id", session.user.id)
        .eq("status", "active")
        .maybeSingle();

      if (profileError || !profile) throw new Error("Admin access is not enabled for this account.");
      return { session, profile };
    }

    function storeAdminSession(session, profile) {
      localStorage.setItem(adminSessionKey, JSON.stringify({
        email: profile.email || session.user.email,
        role: profile.role || "admin",
        provider: "supabase",
        userId: session.user.id,
        createdAt: new Date().toISOString(),
        expiresAt: session.expires_at ? new Date(session.expires_at * 1000).toISOString() : new Date(Date.now() + 60 * 60 * 1000).toISOString(),
        gateVersion
      }));
      touchIdleActivity();
    }

    async function prepareRecoverySession() {
      if (!supabaseClient) throw new Error("Supabase admin auth is not configured for this build.");
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const query = new URLSearchParams(location.search);
      if (query.get("code")) {
        const { error } = await supabaseClient.auth.exchangeCodeForSession(query.get("code"));
        if (error) throw error;
      } else if (hash.get("access_token") && hash.get("refresh_token")) {
        const { error } = await supabaseClient.auth.setSession({
          access_token: hash.get("access_token"),
          refresh_token: hash.get("refresh_token")
        });
        if (error) throw error;
      }
      await activeAdminFromSession();
    }

    async function supabaseAdminLogin(email, password) {
      if (!supabaseClient) throw new Error("Supabase admin auth is not configured for this build.");
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error || !data?.session?.user) throw new Error(error?.message || "Admin login failed.");

      const { data: profile, error: profileError } = await supabaseClient
        .from("aa_admin_profiles")
        .select("user_id,email,role,status")
        .eq("user_id", data.session.user.id)
        .eq("status", "active")
        .maybeSingle();

      if (profileError || !profile) {
        await supabaseClient.auth.signOut();
        throw new Error("Admin access is not enabled for this account.");
      }

      await supabaseClient.from("aa_admin_audit_events").insert({
        user_id: data.session.user.id,
        email: profile.email || data.session.user.email || email,
        event_type: "admin_login_completed",
        metadata: {
          source_path: location.pathname,
          provider: "supabase",
          gate_version: gateVersion
        }
      });

      return {
        email: profile.email || data.session.user.email || email,
        role: profile.role || "admin",
        provider: "supabase",
        userId: data.session.user.id,
        createdAt: new Date().toISOString(),
        expiresAt: data.session.expires_at ? new Date(data.session.expires_at * 1000).toISOString() : new Date(Date.now() + 60 * 60 * 1000).toISOString(),
        gateVersion
      };
    }

    function mountRecoveryPasswordForm() {
      // WHY: Do not ship password-setting controls in the default unauthenticated DOM. They are added only after a recovery link is being processed.
      if (resetForm.dataset.mounted === "true") return;
      const nextLabel = ["New", "password"].join(" ");
      const confirmLabel = ["Confirm", "password"].join(" ");
      const submitLabel = ["Set", "admin", "password"].join(" ");
      resetForm.innerHTML = `
        <label>${nextLabel}
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="${nextLabel}" minlength="8">
        </label>
        <label>${confirmLabel}
          <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="${confirmLabel}" minlength="8">
        </label>
        <button class="btn primary" type="submit">${submitLabel}</button>
      `;
      resetForm.dataset.mounted = "true";
    }

    async function initRecoveryMode() {
      const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
      const query = new URLSearchParams(location.search);
      const isRecovery = hash.get("type") === "recovery" || query.get("type") === "recovery" || query.has("code");
      if (!isRecovery) return;
      adminForm.classList.add("is-hidden");
      mountRecoveryPasswordForm();
      resetForm.classList.remove("is-hidden");
      document.getElementById("adminTitle").textContent = ["Set", "admin", "password"].join(" ");
      showResult(["Password", "reset", "link", "verified.", "Enter", "a", "new", "admin", "password."].join(" "));
      try {
        await prepareRecoverySession();
      } catch (error) {
        showResult(error.message, true);
      }
    }

    document.getElementById("adminForm").addEventListener("submit", async event => {
      event.preventDefault();
      const email = document.getElementById("adminEmail").value.trim().toLowerCase();
      const password = document.getElementById("adminPassword").value;
      try {
        let admin;
        if (supabaseClient) {
          admin = await supabaseAdminLogin(email, password);
        } else {
          if (isPublicStatic) throw new Error("Production admin requires Supabase authentication.");
          admin = await apiLogin(email, password);
        }
        const session = {
          email: admin.email || email,
          role: admin.role || "admin",
          provider: admin.provider || "api",
          userId: admin.userId || null,
          createdAt: admin.createdAt || new Date().toISOString(),
          expiresAt: admin.expiresAt || new Date(Date.now() + 8 * 60 * 60 * 1000).toISOString(),
          gateVersion
        };
        localStorage.setItem(adminSessionKey, JSON.stringify(session));
        touchIdleActivity();
        showResult("Admin access verified. Opening console.");
        setTimeout(() => { window.location.href = next; }, 550);
      } catch (error) {
        showResult(error.message, true);
      }
    });

    resetForm.addEventListener("submit", async event => {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirmation = document.getElementById("confirmPassword").value;
      try {
        if (password.length < 8) throw new Error("Use at least 8 characters.");
        if (password !== confirmation) throw new Error("Passwords do not match.");
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) throw error;
        const { session, profile } = await activeAdminFromSession();
        storeAdminSession(session, profile);
        showResult("Admin password updated. Opening console.");
        setTimeout(() => { window.location.href = next; }, 700);
      } catch (error) {
        showResult(error.message, true);
      }
    });

    initRecoveryMode();
  </script>
</body>
</html>
