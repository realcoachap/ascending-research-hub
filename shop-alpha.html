<!doctype html>
<!-- Ascending Research retired shop alpha v0.5.15 - Theo ☠️ - 2026-06-01 -->
<!-- WHY: The old alpha contained cart/account/admin prototype state on the Research Hub origin; it now clears legacy state and returns to the education/data hub. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=index.html">
  <meta name="robots" content="noindex">
  <title>Retired Shop Alpha | Ascending Research</title>
  <script>
    (function(){
      const legacyKeys=[
        "ar-shop-account",
        "ar-shop-auth",
        "ar-shop-gate",
        "ar-shop-products",
        "ar-shop-lang",
        "ar-shop-theme"
      ];
      legacyKeys.forEach(key=>localStorage.removeItem(key));
      location.replace("index.html" + location.search);
    })();
  </script>
</head>
<body>
  <p>Retired shop alpha. Returning to Ascending Research Hub.</p>
  <p><a href="index.html">Open Ascending Research Hub</a></p>
</body>
</html>
